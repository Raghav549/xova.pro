<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="xovaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Ghost body with gradient -->
  <ellipse cx="50" cy="55" rx="30" ry="35" fill="url(#xovaGradient)" filter="url(#glow)" opacity="0.9"/>
  
  <!-- Ghost tail waves -->
  <path d="M 20 55 Q 15 70 20 85 L 30 75 L 40 85 L 50 75 L 60 85 L 70 75 L 80 85 Q 85 70 80 55 Z" 
        fill="url(#xovaGradient)" filter="url(#glow)" opacity="0.9"/>
  
  <!-- Eyes with glow effect -->
  <circle cx="40" cy="50" r="6" fill="#fff" filter="url(#glow)"/>
  <circle cx="60" cy="50" r="6" fill="#fff" filter="url(#glow)"/>
  <circle cx="42" cy="48" r="2.5" fill="#1a1a2e"/>
  <circle cx="62" cy="48" r="2.5" fill="#1a1a2e"/>
  
  <!-- Subtle smile -->
  <path d="M 45 60 Q 50 65 55 60" stroke="#fff" stroke-width="2" fill="none" opacity="0.8"/>
  
  <!-- Tech accent rings -->
  <circle cx="50" cy="50" r="38" stroke="url(#xovaGradient)" stroke-width="1.5" fill="none" opacity="0.4"/>
  <circle cx="50" cy="50" r="42" stroke="url(#xovaGradient)" stroke-width="1" fill="none" opacity="0.2"/>
</svg>
